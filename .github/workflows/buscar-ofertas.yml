name: Buscar ofertas

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buscar-ofertas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar precios y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scraper/scrape.py
      - name: Guardar datos
        run: |
          git config user.name "ofertas-bot"
          git config user.email "ofertas-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M')" && git push)
