<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas de perfumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --ink:#15171C; --muted:#667085; --line:#D9DDE3;
  --garnet:#8E1B3A; --garnet-soft:#F6E7EB; --green:#1B7F4B; --green-soft:#E3F3EA;
  --serif:"Fraunces",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121316;--surface:#1B1D22;--ink:#EEF0F3;--muted:#9AA1AD;--line:#2D3038;
        --garnet:#E0657F;--garnet-soft:#3A1B25;--green:#5CCB8D;--green-soft:#17301F}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font:700 clamp(30px,7vw,46px)/1.05 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;font:500 15px var(--sans);cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls{display:grid;gap:10px;margin-bottom:10px}
input[type=search],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:400 16px var(--sans)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;font:500 14px var(--sans);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--garnet);background:var(--garnet-soft);color:var(--garnet)}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.count{font-size:13px;color:var(--muted);margin:14px 0 4px}
:focus-visible{outline:2px solid var(--garnet);outline-offset:2px}

/* lista de ofertas */
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item a.thumb{width:72px;height:72px;border-radius:10px;background:var(--surface);display:grid;place-items:center;overflow:hidden}
.item img{width:100%;height:100%;object-fit:contain}
.brand{font-size:12px;color:var(--muted);font-weight:600}
.name{font-weight:600;line-height:1.25;margin:1px 0 3px;overflow-wrap:anywhere}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline}
.meta{font-size:13px;color:var(--muted)}
.price{font-weight:600}
.old{text-decoration:line-through;color:var(--muted);font-size:13px;margin-left:6px}
.pct{font:700 34px/1 var(--serif);color:var(--garnet);text-align:right}
.pct small{display:block;font:500 11px var(--sans);color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-right:6px}
.tag.down{background:var(--green-soft);color:var(--green)}
.tag.out{background:var(--line);color:var(--muted)}
svg.spark{vertical-align:middle;margin-left:6px}

/* comparador */
.group{padding:16px 0;border-bottom:1px solid var(--line)}
.group h3{font:600 17px/1.25 var(--serif);margin:0 0 2px}
.group .save{font-size:13px;color:var(--green);font-weight:600;margin-bottom:8px}
.offer{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:inherit;font-size:15px}
.offer:hover{background:var(--surface)}
.offer.best{background:var(--green-soft)}
.offer .t{font-weight:500}
.offer .best-l{font-size:11px;font-weight:700;color:var(--green);margin-left:6px}
.more{display:block;margin:18px auto 0;padding:11px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--sans);cursor:pointer}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.status{margin-top:34px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--green)}
.dot.bad{background:var(--garnet)}
@media (max-width:420px){.pct{font-size:28px}.item{grid-template-columns:60px 1fr auto}.item a.thumb{width:60px;height:60px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ofertas de perfumes</h1>
  <p class="sub" id="sub">Cargando…</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="ofertas">Ofertas</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="comparar">Comparar tiendas</button>
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="Buscar: Sauvage, Good Girl, Chanel…" aria-label="Buscar perfume">
    <div class="chips" id="chips" aria-label="Tiendas"></div>
    <div class="row2" id="ofertasCtl">
      <select id="min" aria-label="Descuento mínimo">
        <option value="0">Cualquier descuento</option>
        <option value="20">Desde 20%</option>
        <option value="30">Desde 30%</option>
        <option value="40" selected>Desde 40%</option>
        <option value="50">Desde 50%</option>
        <option value="60">Desde 60%</option>
      </select>
      <select id="sort" aria-label="Ordenar">
        <option value="desc">Mayor descuento</option>
        <option value="precio">Menor precio</option>
        <option value="ml">Menor precio por ml</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="stock" checked> Solo con stock</label>
  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>
  <button class="more" id="more" hidden>Ver más</button>
  <div class="status" id="status"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const money = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st = {tab:'ofertas', q:'', tiendas:new Set(), min:40, sort:'desc', stock:true, n:50};
let D = {productos:[], tiendas:{}}, H = {};

const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/\d+(?:[.,]\d+)?\s*ml/g,' ').replace(/[^a-z0-9 ]/g,' ')
  .replace(/\b(perfume|para|de|el|la|spray|vaporizador|x|ml|mujer|hombre|women|men|unisex)\b/g,' ')
  .replace(/\s+/g,' ').trim();
const plain = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const ppm = p => p.ml ? p.precio / p.ml : Infinity;

function ago(iso){
  if(!iso) return 'sin datos todavía';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 2) return 'recién';
  if(m < 60) return `hace ${m} min`;
  if(m < 1440) return `hace ${Math.round(m/60)} h`;
  return `hace ${Math.round(m/1440)} días`;
}

function spark(id){
  const h = H[id]; if(!h || h.length < 2) return '';
  const v = h.map(x => x[1]), min = Math.min(...v), max = Math.max(...v), r = max - min || 1;
  const pts = v.map((y,i) => `${(i/(v.length-1)*54+2).toFixed(1)},${(18-((y-min)/r)*16).toFixed(1)}`).join(' ');
  const down = v[v.length-1] < v[0];
  return `<svg class="spark" width="58" height="20" viewBox="0 0 58 20" role="img" aria-label="Historial de precio"><polyline points="${pts}" fill="none" stroke="${down?'var(--green)':'var(--muted)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function filtrados(){
  const q = plain(st.q);
  return D.productos.filter(p =>
    (!st.stock || p.stock) &&
    (!st.tiendas.size || st.tiendas.has(p.tienda)) &&
    (!q || plain(p.marca + ' ' + p.nombre).includes(q)));
}

function renderOfertas(){
  let L = filtrados().filter(p => p.descuento >= st.min && (st.min > 0 || true));
  if(st.min > 0) L = L.filter(p => p.lista);
  L.sort(st.sort === 'precio' ? (a,b) => a.precio - b.precio
       : st.sort === 'ml' ? (a,b) => ppm(a) - ppm(b)
       : (a,b) => b.descuento - a.descuento || a.precio - b.precio);
  $('#count').textContent = `${L.length} ${L.length === 1 ? 'oferta' : 'ofertas'}`;
  if(!L.length){ $('#list').innerHTML = '<div class="empty">No hay ofertas con estos filtros. Probá bajar el descuento mínimo.</div>'; $('#more').hidden = true; return; }
  $('#list').innerHTML = L.slice(0, st.n).map(p => {
    const h = H[p.id], bajo = h && h.length > 1 && h[h.length-1][1] < h[h.length-2][1];
    const pml = p.ml ? ` · ${money.format(p.precio/p.ml)}/ml` : '';
    return `<div class="item">
      <a class="thumb" href="${esc(p.url)}" target="_blank" rel="noopener">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</a>
      <div>
        <div class="brand">${esc(p.marca)}</div>
        <div class="name"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.nombre)}</a></div>
        <div class="meta">${bajo?'<span class="tag down">Bajó de precio</span>':''}${p.stock?'':'<span class="tag out">Sin stock</span>'}${esc(D.tiendas[p.tienda]?.nombre || p.tienda)}${pml}</div>
        <div><span class="price">${money.format(p.precio)}</span>${p.lista?`<span class="old">${money.format(p.lista)}</span>`:''}${spark(p.id)}</div>
      </div>
      <div class="pct">${p.descuento ? '-'+p.descuento+'%' : ''}${p.descuento ? '<small>vs. lista</small>' : ''}</div>
    </div>`;
  }).join('');
  $('#more').hidden = L.length <= st.n;
}

function renderComparar(){
  const g = new Map();
  for(const p of filtrados()){
    const key = [...new Set(norm(p.marca + ' ' + p.nombre).split(' '))].sort().join(' ') + '|' + (p.ml ?? '?');
    if(!g.has(key)) g.set(key, []);
    g.get(key).push(p);
  }
  const grupos = [];
  for(const items of g.values()){
    const porTienda = new Map();
    for(const p of items){ const a = porTienda.get(p.tienda); if(!a || p.precio < a.precio) porTienda.set(p.tienda, p); }
    if(porTienda.size < 2) continue;
    const L = [...porTienda.values()].sort((a,b) => a.precio - b.precio);
    const ahorro = L[L.length-1].precio - L[0].precio;
    grupos.push({L, ahorro, pct: Math.round(ahorro / L[L.length-1].precio * 100)});
  }
  grupos.sort((a,b) => b.pct - a.pct);
  $('#count').textContent = `${grupos.length} perfumes en 2 o más tiendas`;
  if(!grupos.length){ $('#list').innerHTML = '<div class="empty">No encontré el mismo perfume en dos tiendas con estos filtros.</div>'; $('#more').hidden = true; return; }
  $('#list').innerHTML = grupos.slice(0, st.n).map(({L, ahorro, pct}) => {
    const p0 = L[0];
    return `<div class="group">
      <h3>${esc(p0.nombre)}</h3>
      <div class="save">Ahorrás ${money.format(ahorro)} (${pct}%) eligiendo la más barata</div>
      ${L.map((p,i) => `<a class="offer ${i===0?'best':''}" href="${esc(p.url)}" target="_blank" rel="noopener">
        <span class="t">${esc(D.tiendas[p.tienda]?.nombre || p.tienda)}${i===0?'<span class="best-l">Mejor precio</span>':''}</span>
        <span>${money.format(p.precio)}</span></a>`).join('')}
    </div>`;
  }).join('');
  $('#more').hidden = grupos.length <= st.n;
}

function render(){
  $('#ofertasCtl').style.display = st.tab === 'ofertas' ? '' : 'none';
  st.tab === 'ofertas' ? renderOfertas() : renderComparar();
}

function init(){
  const ts = Object.entries(D.tiendas);
  $('#chips').innerHTML = ts.map(([id,t]) => `<button class="chip" aria-pressed="false" data-id="${esc(id)}">${esc(t.nombre)}</button>`).join('');
  $('#sub').textContent = D.productos.length
    ? `${D.productos.length.toLocaleString('es-AR')} productos en ${ts.length} tiendas · actualizado ${ago(D.actualizado)}`
    : 'Todavía no hay datos.';
  $('#status').innerHTML = ts.map(([id,t]) =>
    `<span title="${esc(t.error || '')}"><span class="dot ${t.ok?'':'bad'}"></span>${esc(t.nombre)}: ${t.ok ? t.cantidad + ' productos' : 'con problemas'}</span>`).join('');
  if(!D.productos.length){
    $('#list').innerHTML = '<div class="empty">Todavía no se cargaron precios.<br>En GitHub andá a Actions → “Buscar ofertas” → Run workflow.</div>';
    return;
  }
  render();
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'), chip = e.target.closest('.chip');
  if(tab){ st.tab = tab.dataset.tab; st.n = 50; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b === tab)); render(); }
  if(chip){ const id = chip.dataset.id; st.tiendas.has(id) ? st.tiendas.delete(id) : st.tiendas.add(id); chip.setAttribute('aria-pressed', st.tiendas.has(id)); st.n = 50; render(); }
});
$('#q').addEventListener('input', e => { st.q = e.target.value; st.n = 50; render(); });
$('#min').addEventListener('change', e => { st.min = +e.target.value; st.n = 50; render(); });
$('#sort').addEventListener('change', e => { st.sort = e.target.value; render(); });
$('#stock').addEventListener('change', e => { st.stock = e.target.checked; render(); });
$('#more').addEventListener('click', () => { st.n += 50; render(); });

const bust = '?t=' + Date.now();
Promise.all([
  fetch('data/precios.json' + bust).then(r => r.json()),
  fetch('data/historial.json' + bust).then(r => r.json()).catch(() => ({}))
]).then(([d, h]) => { D = d; H = h; init(); })
  .catch(() => { $('#sub').textContent = 'No pude cargar los datos.'; $('#list').innerHTML = '<div class="empty">Abrí la página desde GitHub Pages (no desde el archivo suelto) para que cargue data/precios.json.</div>'; });
</script>
</body>
</html>
